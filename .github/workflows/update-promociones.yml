name: Actualizar promociones EVHA

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Enviar un mensaje de prueba por Telegram"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Guardar datos anteriores
        run: cp public/data.json /tmp/data-anterior.json

      - name: Generar datos
        run: python scripts/generate_data.py

      - name: Avisar cambios relevantes por Telegram
        if: ${{ !inputs.test_notification }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_changes.py /tmp/data-anterior.json public/data.json

      - name: Enviar mensaje de prueba por Telegram
        if: ${{ inputs.test_notification }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify_changes.py --test

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || git commit -m "Actualizar promociones EVHA"
          git push

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar Pages
        id: deployment
        uses: actions/deploy-pages@v4
